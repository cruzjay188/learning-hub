<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CodeBlock — preview</title>
<style>
  html, body { margin: 0; }
  body { padding: 20px 24px; background: var(--bg); }
</style>
</head>
<body>
<div class="ds-stack" style="max-width:640px">
  <div class="code" data-wrap="false"><div class="code__bar"><span>Terminal</span><button type="button" class="copy-btn"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.2A1.3 1.3 0 0 0 9.2 2H3.8A1.3 1.3 0 0 0 2.5 3.3v5.4A1.3 1.3 0 0 0 3.8 10h.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Copy</span></button></div><pre><code>cd ~/Desktop/codeplatoon/assignments/week-02/netflix &amp;&amp; npm run dev</code></pre></div>
  <div class="code" data-wrap="true"><div class="code__bar"><span>Claude prompt</span><button type="button" class="copy-btn"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.2A1.3 1.3 0 0 0 9.2 2H3.8A1.3 1.3 0 0 0 2.5 3.3v5.4A1.3 1.3 0 0 0 3.8 10h.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Copy</span></button></div><pre><code>Restructure this project into the full-stack layout below. Move files only: don't change any code. Show me the plan (what moves where) first and wait for my approval.</code></pre></div>
</div>
<script>
document.querySelectorAll('.copy-btn').forEach(function (b) { b.addEventListener('click', function () { var s = b.querySelector('span'); s.textContent = 'Copied'; b.dataset.copied = 'true'; setTimeout(function () { s.textContent = 'Copy'; b.dataset.copied = 'false'; }, 1600); }); });
</script>
</body>
</html>
