<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ring — preview</title>
<style>
  html, body { margin: 0; }
  body { padding: 20px 24px; background: var(--bg); }
</style>
</head>
<body>
<div class="ds-row" style="gap:18px"><span class="ringw " style="width:28px;height:28px" data-done="false" aria-hidden="true"><svg class="ring" viewBox="0 0 20 20" data-zero="true"><circle class="ring__track" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100"/><circle class="ring__fill" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100" style="--p:0"/></svg><span class="ringw__disc"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><span class="ringw " style="width:28px;height:28px" data-done="false" aria-hidden="true"><svg class="ring" viewBox="0 0 20 20" data-zero="false"><circle class="ring__track" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100"/><circle class="ring__fill" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100" style="--p:30"/></svg><span class="ringw__disc"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><span class="ringw " style="width:28px;height:28px" data-done="false" aria-hidden="true"><svg class="ring" viewBox="0 0 20 20" data-zero="false"><circle class="ring__track" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100"/><circle class="ring__fill" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100" style="--p:70"/></svg><span class="ringw__disc"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><span class="ringw " style="width:28px;height:28px" data-done="true" aria-hidden="true"><svg class="ring" viewBox="0 0 20 20" data-zero="false"><circle class="ring__track" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100"/><circle class="ring__fill" cx="10" cy="10" r="8.85" stroke-width="2.3" pathLength="100" style="--p:100"/></svg><span class="ringw__disc"><svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><span class="ringw week-ring" style="width:56px;height:56px" data-done="false" aria-hidden="true"><svg class="ring" viewBox="0 0 20 20" data-zero="false"><circle class="ring__track" cx="10" cy="10" r="9.0" stroke-width="2" pathLength="100"/><circle class="ring__fill" cx="10" cy="10" r="9.0" stroke-width="2" pathLength="100" style="--p:60"/></svg><span class="ringw__label">3/5</span><span class="ringw__disc"><svg width="28" height="28" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><button type="button" class="btn btn--sm" id="go">Fill</button></div>
<script>
var rs = document.querySelectorAll('.ringw'); document.getElementById('go').addEventListener('click', function () { rs.forEach(function (r) { var f = r.querySelector('.ring__fill'), p = +f.style.getPropertyValue('--p'); p = p >= 100 ? 0 : Math.min(100, p + 30); f.style.setProperty('--p', p); r.querySelector('.ring').dataset.zero = p <= 0; r.dataset.done = p >= 100 && !r.classList.contains('week-ring'); }); });
</script>
</body>
</html>
