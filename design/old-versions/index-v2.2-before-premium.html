$("#palette").addEventListener("click", (e) => { if (e.target === $("#palette")) $("#palette").close(); const b = e.target.closest("[data-pal]"); if (b) { palNavigated = true; palRun(+b.dataset.pal); } });
$("#pal-input").addEventListener("input", (e) => drawPalette(e.target.value));
$("#pal-input").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); palNavigated = true; palRun(palSel); }
});
function toggleTheme() {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("hub:theme", root.dataset.theme); } catch {}
}
try { const t = localStorage.getItem("hub:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
function navigate(hash) { if (location.hash === hash) { instantNav = false; render({ userNav: true }); } else { userNav = true; location.hash = hash; } }
let userNav = false;

// ================= events =================
document.addEventListener("click", (e) => {
  const m = $("#menu");
  if (!m.hidden && !e.target.closest("#menu") && !e.target.closest("[data-status-menu]")) closeMenu();
  if (e.target.closest("a[href^='#']")) { userNav = true; const lr = e.target.closest(".lrow"); vtFrom = lr ? $(".lrow__title", lr) : null; if (sheet().open && e.target.closest("#sheet")) closeSheet(); return; }
  const b = e.target.closest("button"); if (!b) return;
  if ("toastAction" in b.dataset) { const fn = toastFn; toastFn = null; $("#toast").dataset.show = "false"; if (fn) fn(); return; }
  const d = b.dataset;
  const r = route();

  if (d.tick) {
    const [lid, sid] = d.tick.split("|");
    const on = toggleStep(lid, sid);
    if (r.view === "lecture") {
      if (!on) setOpen(lid, sid, false); patchLecture(LB(lid)); renderShell(r);
      const mk = $(`#step-${CSS.escape(sid)} .marker`); if (mk && !document.activeElement.closest(".step")) mk.focus({ preventScroll: true });
      else if (mk && b.classList.contains("step__undo")) mk.focus({ preventScroll: true });
      if (on) markNew(sid);
    } else { render(); const cb = on && $(`.cb[data-tick="${CSS.escape(d.tick)}"]`); if (cb) cb.classList.add("is-new"); }
    return;
  }
  if (d.toggle) { const l = LB(r.id); const li = b.closest(".step"); const open = li.dataset.open !== "true"; setOpen(l.id, d.toggle, open); patchLecture(l); return; }
  if (d.jump) { const l = LB(r.id); setOpen(l.id, d.jump, true); patchLecture(l); scrollToStep(d.jump); const t = $(`#step-${CSS.escape(d.jump)} .step__toggle`); if (t) t.focus({ preventScroll: true }); return; }
  if (d.conf) {
    const g = b.closest("[data-rating]"); const lid = g.dataset.rating; const n = +d.conf;
    rate(lid, n, { review: !!g.dataset.review });
    if (g.dataset.review) { toast(`Rated ${CONF[n - 1]}`); closeSheet(); return; }
    if (sheet().open) { sheet().querySelector(".sheet__body > div").innerHTML = ratingControl(LB(lid), etNow().today, null, true); sheet().querySelector(`[data-conf="${n}"]`).focus(); return; }
    render(); return;
  }
  if (d.recall) {
    const l = LB(d.l), st = LS(l.id), rc = { missed: [...((st.recall && st.recall.missed) || [])], got: [...((st.recall && st.recall.got) || [])] };
    rc.missed = rc.missed.filter((t) => t !== d.term); rc.got = rc.got.filter((t) => t !== d.term);
    rc[d.recall === "got" ? "got" : "missed"].push(d.term);
    putLecture(l.id, { recall: rc });
    render(); return;
  }
  if (d.rv) {
    if (d.rv === "show") rv.shown = true;
    else { rv[d.rv === "got" ? "got" : "missed"].push(rv.terms[rv.i].term); rv.i++; rv.shown = false;
      if (rv.i >= rv.terms.length) { const st = LS(rv.l.id); putLecture(rv.l.id, { recall: { missed: rv.missed, got: rv.got } }, { quiet: false }); } }
    drawReview(); return;
  }
  if (d.goal) { const t = Math.min(7, Math.max(1, (state.goal.weeklyTarget || 4) + +d.goal)); state.goal = { weeklyTarget: t }; writeDoc("meta/goal", state.goal); render(); return; }
  if (d.filter) { state.ui.courseFilter = d.filter; render(); return; }
  if (d.rfilter) { state.ui.reviewFilter = d.rfilter; render(); return; }
  if (d.week) { const w = +d.week; const s = state.ui.openWeeks; s.has(w) ? s.delete(w) : s.add(w); const sec = b.closest(".week"); sec.dataset.open = s.has(w); b.setAttribute("aria-expanded", s.has(w)); return; }
  if (d.statusMenu) { openMenu(b, d.statusMenu); return; }
  if (d.setStatus) {
    const id = menuFor, a = D().assignments.find((x) => x.id === id), prev = assignStatus(a);
    $("#menu").hidden = true; menuFor = null;
    putAssignment(id, { status: d.setStatus, done: d.setStatus === "done" }); render();
    const refocus = () => { const f = $(`[data-status-menu="${CSS.escape(id)}"]`) || $("[data-action='toggle-done']"); if (f) f.focus({ preventScroll: true }); };
    refocus();
    toast(`${aTitle(a)} moved to ${A_LABEL[d.setStatus]}`, { label: "Undo", fn: () => { putAssignment(id, { status: prev, done: prev === "done" }); render(); refocus(); } });
    return;
  }
  if (d.copy) { const [lid, sid] = d.copy.split("|"); const s = stepsOf(LB(lid)).find((x) => x.id === sid); copy(s.code, b, s.codeLabel || "code"); return; }
  if (d.copytext) { copy(d.copytext, b, "path"); return; }
  if (d.cuv !== undefined) { const row = b.closest("[data-cu]"); sheet()._cu[row.dataset.cu].v = d.cuv; $$("[data-cuv]", row).forEach((x) => x.setAttribute("aria-checked", x === b)); return; }

  switch (d.action) {
    case "palette": openPalette(); break;
    case "done-next": {
      toggleStep(d.l, d.s, true);
      const st = stepsOf(LB(d.l)).find((x) => x.id === d.s);
      withTransition("vt-swap", (vt) => {
        render({ swap: !vt });
        const nb = $("[data-action='done-next']"); if (nb) nb.focus({ preventScroll: true }); else { const ob = $("#upnext a"); if (ob) ob.focus({ preventScroll: true }); }
        toast(`Done: ${st.title}`, { label: "Undo", fn: () => { toggleStep(d.l, d.s, false); render(); const u = $("[data-action='done-next']"); if (u) u.focus({ preventScroll: true }); } });
      });
      break;
    }
    case "done-continue": {
      toggleStep(d.l, d.s, true); const l = LB(d.l); setOpen(l.id, d.s, false); markNew(d.s);
      const nx = firstOpen(l); if (nx) setOpen(l.id, nx.id, true);
      patchLecture(l);
      if (nx) { scrollToStepSoon(nx.id); const t = $(`#step-${CSS.escape(nx.id)} .step__toggle`); if (t) t.focus({ preventScroll: true }); }
      else { const f = $("#finished [role='radio']"); if (f) { $("#finished").scrollIntoView({ block: "center", behavior: "smooth" }); f.focus({ preventScroll: true }); } }
      break;
    }
    case "skip": { const l = LB(d.l); const steps = stepsOf(l); const i = steps.findIndex((x) => x.id === d.s); setOpen(l.id, d.s, false); const nx = steps.slice(i + 1).find((x) => !isDone(l.id, x.id)); if (nx) { setOpen(l.id, nx.id, true); patchLecture(l); scrollToStepSoon(nx.id); } else patchLecture(l); break; }
    case "expand-all": state.ui.expandAll = !state.ui.expandAll; try { localStorage.setItem("hub:guide-expanded", state.ui.expandAll ? "1" : "0"); } catch {} state.ui.open = {}; render(); break;
    case "reveal": state.ui.revealed[d.key] = !state.ui.revealed[d.key]; render(); break;
    case "clear-rating": { rate(d.l, 0); render(); const f = $('.rail [role="radio"][tabindex="0"]') || $('[role="radio"][tabindex="0"]'); if (f) f.focus({ preventScroll: true }); break; }
    case "quizme": copy(quizPrompt(LB(d.l)), b, "Quiz me prompt"); break;
    case "sheet-rate": sheetRate(d.l); break;
    case "sheet-notes": sheetNotes(d.l); break;
    case "close-sheet": closeSheet(); break;
    case "help": sheetHelp(); break;
    case "catchup": sheetCatchup(); break;
    case "catchup-later": state.onboarded = { at: new Date().toISOString(), skipped: true }; writeDoc("meta/onboarded", state.onboarded); render(); break;
    case "catchup-save": {
      const ch = sheet()._cu;
      Object.entries(ch).forEach(([lid, c]) => {
        const l = LB(lid);
        if (c.v === "done") { const steps = {}; stepsOf(l).forEach((s) => { steps[s.id] = true; }); putLecture(lid, { steps }, { quiet: true }); }
      });
      state.onboarded = { at: new Date().toISOString() }; writeDoc("meta/onboarded", state.onboarded);
      closeSheet(); toast("Saved. Up next is updated."); break;
    }
    case "start-review": startReview(d.l); break;
    case "toggle-timeline": state.ui.timelineOpen = !state.ui.timelineOpen; render(); break;
    case "log-today": markActive(true); toast("Logged today"); render(); break;
    case "weeks-all": { const all = [...new Set(D().days.map((x) => x.week))]; state.ui.openWeeks = state.ui.openWeeks.size >= all.length ? new Set() : new Set(all); render(); break; }
    case "clear-filter": { state.ui.courseFilter = "all"; state.ui.module = ""; render(); const f = $('[data-filter="all"]'); if (f) f.focus({ preventScroll: true }); break; }
    case "toggle-done": state.ui.showDone = !state.ui.showDone; render(); break;
  }
});
document.addEventListener("change", (e) => { if (e.target.matches("[data-action='module']")) { state.ui.module = e.target.value; render(); } });
$("#save").addEventListener("click", () => { if (state.mode === "error") location.reload(); else sheetHelp(); });

let notesT = {};
document.addEventListener("input", (e) => {
  const ta = e.target.closest("textarea[data-notes]"); if (!ta) return;
  const lid = ta.dataset.notes;
  $$(`[data-notes-status="${CSS.escape(lid)}"]`).forEach((s) => { s.textContent = "Typing…"; });
  clearTimeout(notesT[lid]);
  notesT[lid] = setTimeout(() => {
    putLecture(lid, { notes: ta.value });
    state.ui.notesSavedAt[lid] = new Date().toISOString();
    $$(`[data-notes-status="${CSS.escape(lid)}"]`).forEach((s) => { s.textContent = state.mode === "cloud" ? "Saved just now" : "Saved in this browser"; });
    $$(`textarea[data-notes="${CSS.escape(lid)}"]`).forEach((t) => { if (t !== ta) t.value = ta.value; });
  }, 800);
});

// keyboard: shortcuts, radio arrows, menu
let gPending = 0;
document.addEventListener("keydown", (e) => {
  const tgt = e.target;
  const typing = tgt.matches && tgt.matches("input, textarea, select, [contenteditable]");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#palette").open ? $("#palette").close() : openPalette(); return; }
  const m = $("#menu");
  if (!m.hidden) {
    const items = $$("button", m); const i = items.indexOf(document.activeElement);
    if (e.key === "Escape") { e.preventDefault(); closeMenu(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    return;
  }
  if (tgt.matches && tgt.matches('[role="radio"]') && ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown"].includes(e.key)) {
    const group = tgt.closest('[role="radiogroup"]'); const rs = $$('[role="radio"]:not(:disabled)', group); const i = rs.indexOf(tgt);
    const n = rs[(i + (e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : -1) + rs.length) % rs.length];
    e.preventDefault(); n.focus(); n.click(); return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || $("#palette").open || sheet().open) return;
  const r = route();
  if (gPending && Date.now() - gPending < 1200) {
    gPending = 0;
    const map = { t: "#today", c: "#course", r: "#review", w: "#work" };
    if (map[e.key]) { e.preventDefault(); instantNav = true; navigate(map[e.key]); }
    return;
  }
  if (e.key === "/") { e.preventDefault(); openPalette(); return; }
  if (e.key === "?") { e.preventDefault(); sheetHelp(); return; }
  if (e.key === "g") { gPending = Date.now(); return; }
  if (r.view !== "lecture") return;
  const l = LB(r.id); if (!l) return;
  const steps = stepsOf(l);
  const curEl = document.activeElement && document.activeElement.closest && document.activeElement.closest(".step");
  const cur = curEl ? steps.find((s) => s.id === curEl.dataset.step) : firstOpen(l) || steps[steps.length - 1];
  const ci = steps.indexOf(cur);
  if (e.key === "j" || e.key === "k") {
    e.preventDefault(); const nx = steps[Math.min(steps.length - 1, Math.max(0, ci + (e.key === "j" ? 1 : -1)))]; if (!nx) return;
    instantMode(); setOpen(l.id, nx.id, true); patchLecture(l); scrollToStep(nx.id, true); const t = $(`#step-${CSS.escape(nx.id)} .step__toggle`); if (t) t.focus({ preventScroll: true });
  } else if (e.key === "x" && cur) { e.preventDefault(); instantMode(); toggleStep(l.id, cur.id); patchLecture(l); const t = $(`#step-${CSS.escape(cur.id)} .marker`); if (t) t.focus({ preventScroll: true }); }
  else if (e.key === "c" && cur && cur.code) { e.preventDefault(); copy(cur.code, null, cur.codeLabel || "code"); }
  else if (/^[1-5]$/.test(e.key) && l.date <= etNow().today) { e.preventDefault(); rate(l.id, +e.key); render({ instant: true }); }
  else if (e.key === "n") { e.preventDefault(); if (matchMedia("(max-width: 899px)").matches) sheetNotes(l.id); else { const t = $(`#notes-${CSS.escape(l.id)}`); if (t) t.focus(); } }
  else if (e.key === "e") { e.preventDefault(); state.ui.expandAll = !state.ui.expandAll; state.ui.open = {}; render({ instant: true }); }
});
// Route changes: drilling into a lecture slides forward, leaving it slides back; tabs just fade in.
let vtFrom = null, instantNav = false;
const depthOf = (r) => (r && r.view === "lecture" ? 1 : 0);
function navRender() {
  const to = route(), from = lastRoute, instant = instantNav, src = vtFrom;
  instantNav = false; vtFrom = null;
  let dir = 0;
  if (from && depthOf(to) !== depthOf(from)) dir = depthOf(to) > depthOf(from) ? 1 : -1;
  else if (from && depthOf(to) && to.id !== from.id) dir = L().findIndex((x) => x.id === to.id) > L().findIndex((x) => x.id === from.id) ? 1 : -1;
  if (!dir || instant || !document.startViewTransition || reducedMotion()) { render({ userNav: true, instant }); return; }
  const h = document.documentElement;
  h.classList.add("vt", dir > 0 ? "vt-fwd" : "vt-back");
  const morph = dir > 0 && src && document.contains(src);
  if (morph) src.style.viewTransitionName = "lec-title";
  const t = document.startViewTransition(() => {
    if (morph) src.style.viewTransitionName = "";
    render({ userNav: true, vt: true });
    const ti = morph && $("#v-title"); if (ti) ti.style.viewTransitionName = "lec-title";
  });
  t.finished.finally(() => { h.classList.remove("vt", "vt-fwd", "vt-back"); const ti = $("#v-title"); if (ti) ti.style.viewTransitionName = ""; });
}
window.addEventListener("hashchange", () => { userNav = false; if (state.data) navRender(); });
setInterval(() => { if (route().view === "today" && !document.activeElement.matches("textarea, input") && !sheet().open && !$("#palette").open) render(); }, 60000);
window.addEventListener("resize", () => { placeTabInd(true); if (route().view === "today") { $$(".nowline").forEach((n) => n.remove()); $$(".timeline .sr-only").forEach((n) => n.remove()); placeNowLine(); } });

// ================= boot =================
loadLocal();
function boot(data) { state.data = data; render({ first: true }); renderSave(); connectDb(); if (document.fonts) document.fonts.ready.then(() => placeTabInd(true)); }
fetch("hub-data.json").then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((data) => {
  try { localStorage.setItem("eagle-hub:data", JSON.stringify(data)); } catch {}
  boot(data);
}).catch(() => {
  let cached = null; try { cached = JSON.parse(localStorage.getItem("eagle-hub:data") || "null"); } catch {}
  if (cached) { boot(cached); toast("Showing your last saved copy of the course data."); return; }
  $("#view").innerHTML = `<div class="empty"><p>Couldn't load the course data. Reload the page. If it keeps happening, run <code>/sync</code> in Claude Code to republish it.</p><button type="button" class="btn btn--primary" onclick="location.reload()">Reload</button></div>`;
  state.mode = "error"; renderSave();
});
})();
